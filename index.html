
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Interference Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Optical Interference Simulation</h1>
        <p class="subtitle">Young's Double Slit Experiment</p>

        <div class="controls">

            <div class="control">
                <label>Wavelength (nm)</label>
                <input type="range" id="wavelength"
                       min="400" max="700" value="650">
                <span>400 - 700 nm</span>
            </div>

            <div class="control">
                <label>Slit Separation (mm)</label>
                <input type="range" id="slitSeparation"
                       min="0.1" max="2" step="0.1" value="0.5">
                <span>0.1 - 2 mm</span>
            </div>

            <div class="control">
                <label>Screen Distance (m)</label>
                <input type="range" id="screenDistance"
                       min="0.5" max="5" step="0.1" value="2">
                <span>0.5 - 5 m</span>
            </div>

        </div>

        <button id="run">Run Simulation</button>

        <div class="result">
            <h2>Interference Pattern</h2>
            <canvas id="pattern" width="700" height="250"></canvas>

            <h3>Fringe Width:</h3>
            <p id="fringeWidth">Click Run Simulation</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
